[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsearch-assistant"
version = "0.1.0"
description = "Multimodal RAG desktop application for intelligent personal document search"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "DeepSearch Team"},
]

dependencies = [
    # Core LLM
    "llama-cpp-python>=0.3.0",
    "sentence-transformers>=3.0",

    # Vector DB
    "qdrant-client>=1.12",

    # Document parsing
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",

    # UI
    "PyQt6>=6.6",

    # Infrastructure
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.23",
    "rich>=13.0",

    # Auto-indexing
    "watchdog>=4.0",

    # Image
    "Pillow>=10.0",
]

[project.optional-dependencies]
multimodal = [
    "faster-whisper>=1.0",
    "paddleocr>=2.7",
    "opencv-python-headless>=4.9",
    "python-pptx>=0.6",
    "openpyxl>=3.1",
]
cloud = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "httpx>=0.27",
]
openvino = [
    "openvino>=2024.0",
    "optimum-intel>=1.18",
    "nncf>=2.9",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.3",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
all = [
    "deepsearch-assistant[multimodal,cloud,openvino,dev]",
]

[project.scripts]
deepsearch = "deepsearch.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Fast, no hardware, runs in CI on every commit",
    "integration: Needs Qdrant + real files, no GPU",
    "hardware: Requires real hardware with GPU/NPU",
    "slow: Cold-start tests, run weekly or pre-release",
    "rag_quality: DeepEval/RAGAS, needs LLM judge",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
